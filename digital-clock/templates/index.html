<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi-Timezone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Digital Clock</h1>
            <p>View current time across multiple time zones</p>
        </div>

        <div class="controls">
            <div class="format-toggle">
                <span>24-Hour Format:</span>
                <div class="toggle-switch" id="formatToggle"></div>
            </div>
            <div class="theme-toggle">
                <span>Dark Theme:</span>
                <div class="toggle-switch" id="themeToggle"></div>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be inserted here -->
        </div>

        <div class="add-timezone-section">
            <h3>Add New Timezone</h3>
            <div class="timezone-input-group">
                <input type="text" id="timezoneInput" placeholder="e.g., America/Los_Angeles, Europe/Paris, Asia/Singapore..." list="timezoneList">
                <button class="btn btn-add" onclick="addTimezone()">Add Timezone</button>
            </div>
            <datalist id="timezoneList"></datalist>
        </div>
    </div>

    <script>
        let format24h = false;
        let allTimezones = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Load preferences from localStorage
            format24h = localStorage.getItem('format24h') === 'true';
            const darkTheme = localStorage.getItem('darkTheme') === 'true';

            if (format24h) document.getElementById('formatToggle').classList.add('active');
            if (darkTheme) {
                document.body.classList.add('dark-theme');
                document.getElementById('themeToggle').classList.add('active');
            }

            // Setup event listeners
            document.getElementById('formatToggle').addEventListener('click', toggleFormat);
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('timezoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addTimezone();
            });

            // Fetch data and start clock
            fetchAllTimezones();
            updateClocks();
            setInterval(updateClocks, 1000);
        });

        async function fetchAllTimezones() {
            try {
                const response = await fetch('/api/timezones');
                const data = await response.json();
                allTimezones = data.available;
                populateTimezoneList();
            } catch (error) {
                console.error('Error fetching timezones:', error);
            }
        }

        function populateTimezoneList() {
            const datalist = document.getElementById('timezoneList');
            datalist.innerHTML = '';
            allTimezones.slice(0, 50).forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                datalist.appendChild(option);
            });
        }

        async function updateClocks() {
            try {
                const response = await fetch('/api/time');
                const times = await response.json();
                displayClocks(times);
            } catch (error) {
                console.error('Error fetching time:', error);
            }
        }

        function displayClocks(times) {
            const grid = document.getElementById('clocksGrid');
            
            if (Object.keys(times).length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No timezones configured</p></div>';
                return;
            }

            grid.innerHTML = Object.entries(times).map(([tz, data]) => `
                <div class="clock-card">
                    <div class="timezone-name">${tz}</div>
                    <div class="digital-time">${format24h ? data.time : data.time_12h}</div>
                    <div class="date-display">${data.date}</div>
                    <div class="timezone-offset">${data.offset}</div>
                    <button class="btn remove-btn" onclick="removeTimezone('${tz}')">Remove</button>
                </div>
            `).join('');
        }

        async function addTimezone() {
            const input = document.getElementById('timezoneInput');
            const tz = input.value.trim();

            if (!tz) {
                alert('Please enter a timezone');
                return;
            }

            try {
                const response = await fetch('/api/timezones');
                const data = await response.json();
                
                if (!data.available.includes(tz)) {
                    alert('Invalid timezone. Please select from the list.');
                    return;
                }

                const newTimezones = [...data.current];
                if (!newTimezones.includes(tz)) {
                    newTimezones.push(tz);
                    await fetch('/api/timezones', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({timezones: newTimezones})
                    });
                    input.value = '';
                    updateClocks();
                } else {
                    alert('This timezone is already added');
                }
            } catch (error) {
                console.error('Error adding timezone:', error);
            }
        }

        async function removeTimezone(tz) {
            try {
                const response = await fetch('/api/timezones');
                const data = await response.json();
                
                const newTimezones = data.current.filter(t => t !== tz);
                await fetch('/api/timezones', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({timezones: newTimezones})
                });
                updateClocks();
            } catch (error) {
                console.error('Error removing timezone:', error);
            }
        }

        function toggleFormat() {
            format24h = !format24h;
            localStorage.setItem('format24h', format24h);
            document.getElementById('formatToggle').classList.toggle('active');
            updateClocks();
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('darkTheme', isDark);
            document.getElementById('themeToggle').classList.toggle('active');
        }
    </script>
</body>
</html>
